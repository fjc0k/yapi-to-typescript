name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Codecov
        if: matrix.os == 'ubuntu-latest'
        run: pnpm codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
